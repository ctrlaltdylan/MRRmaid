[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mrrmaid"
version = "0.1.0"
description = "CLI dashboard for tracking MRR, NRR, churn, and customer concentration from Shopify Partner and Stripe"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dylan Pierce", email = "dylanjpierce@gmail.com"}
]
keywords = [
    "mrr",
    "saas",
    "metrics",
    "revenue",
    "churn",
    "nrr",
    "shopify",
    "stripe",
    "analytics",
    "dashboard",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.31.0",
    "stripe>=7.0.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/ctrlaltdylan/MRRmaid"
Repository = "https://github.com/ctrlaltdylan/MRRmaid"
Issues = "https://github.com/ctrlaltdylan/MRRmaid/issues"

[project.scripts]
mrrmaid = "mrrmaid.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
